<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; object-src 'none'; base-uri 'self';" />
    <title>Vetrina dei Trofei del Polpa - Falco Sabaudo</title>
    <link rel="canonical" href="https://falcosabaudo-it.vercel.app/trofei.html" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <style>
        .desert {
            position: relative;
            height: 320px;
            overflow: hidden;
            border-radius: 0.75rem;
            border: 2px solid #facc15;
            background: linear-gradient(to bottom, #fde68a 0%, #fbbf24 55%, #d97706 100%);
        }
        .sun {
            position: absolute;
            top: 28px;
            right: 14%;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #fff7ed;
            box-shadow: 0 0 40px 16px rgba(255, 247, 237, 0.7);
        }
        .dune {
            position: absolute;
            left: -10%;
            width: 120%;
            border-radius: 50% 50% 0 0;
        }
        .dune-back { bottom: 50px; height: 110px; background: #f59e0b; }
        .dune-front { bottom: -40px; height: 130px; background: #d97706; }
        .cactus { position: absolute; bottom: 70px; left: 12%; }
        .rolling {
            position: absolute;
            bottom: 62px;
            left: 0;
            animation: cross 9s linear infinite;
        }
        .rolling svg {
            display: block;
            animation: spin 1.4s linear infinite;
        }
        .rolling .hop { animation: hop 0.7s ease-in-out infinite; }
        @keyframes cross {
            from { transform: translateX(-120px); }
            to { transform: translateX(calc(100vw)); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes hop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .rolling, .rolling svg, .rolling .hop { animation: none; }
            .rolling { left: 45%; }
        }
    </style>
</head>
<body class="bg-green-900 text-white font-sans">
    <header class="text-center py-8 border-b border-yellow-400">
        <a href="index.html"><img src="assets/logo.svg" alt="Logo Falco Sabaudo" class="mx-auto w-32 mb-4" /></a>
        <h1 class="text-4xl font-bold">Vetrina dei Trofei del Polpa</h1>
        <nav class="mt-4">
            <a href="index.html" class="text-yellow-400 underline mx-2">Home</a>
            <a href="storia.html" class="text-yellow-400 underline mx-2">La nostra storia</a>
            <a href="campionato.html" class="text-yellow-400 underline mx-2">Gestione Campionato</a>
            <a href="timer.html" class="text-yellow-400 underline mx-2">Timer Partita</a>
            <a href="trofei.html" class="text-yellow-400 underline mx-2 font-bold">Vetrina dei trofei di Polpa</a>
        </nav>
    </header>

    <main class="px-6 py-8">
        <div class="max-w-3xl mx-auto">
            <div class="desert" role="img" aria-label="Un deserto vuoto con un cespuglio secco che rotola: nessun trofeo in vista">
                <div class="sun"></div>
                <div class="dune dune-back"></div>

                <svg class="cactus" width="46" height="90" viewBox="0 0 46 90" aria-hidden="true">
                    <rect x="17" y="8" width="12" height="82" rx="6" fill="#166534" />
                    <rect x="2" y="30" width="10" height="26" rx="5" fill="#166534" />
                    <rect x="2" y="48" width="20" height="9" rx="4" fill="#166534" />
                    <rect x="34" y="20" width="10" height="26" rx="5" fill="#166534" />
                    <rect x="24" y="38" width="20" height="9" rx="4" fill="#166534" />
                </svg>

                <div class="rolling" aria-hidden="true">
                    <div class="hop">
                        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" stroke="#78350f" stroke-width="2.2" stroke-linecap="round">
                            <circle cx="36" cy="36" r="30" />
                            <ellipse cx="36" cy="36" rx="30" ry="14" transform="rotate(25 36 36)" />
                            <ellipse cx="36" cy="36" rx="30" ry="14" transform="rotate(-35 36 36)" />
                            <ellipse cx="36" cy="36" rx="14" ry="30" transform="rotate(20 36 36)" />
                            <path d="M12 24 Q36 40 60 20 M10 46 Q34 30 62 50 M24 10 Q38 36 22 62 M50 8 Q34 34 52 64" />
                        </svg>
                    </div>
                </div>

                <div class="dune dune-front"></div>
            </div>

            <section class="text-center mt-8">
                <h2 class="text-2xl font-bold text-yellow-400">Nessun trofeo trovato</h2>
                <p class="mt-3">Vetrina in allestimento dal 2007. Ultimo trofeo conquistato: <em>in via di definizione...</em>.</p>
                <p class="mt-2 text-sm italic text-gray-300">Ci scusiamo per il disagio.</p>
                <a href="index.html" class="inline-block mt-6 text-yellow-400 underline">← Torna alla Home</a>
            </section>
        </div>
    </main>
</body>
</html>
